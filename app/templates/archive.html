<div class="quality-grid detail"><section class="panel"><h3>本次计算档案</h3>{% if manifest %}<dl><dt>扩推摘要</dt><dd class="digest">{{ manifest.result_sha256 }}</dd><dt>处理耗时</dt><dd>{{ manifest.elapsed_ms }} ms</dd></dl>{% else %}<p>当前场次待归档。</p>{% endif %}<button id="save-run" data-sample="{{ sample }}" data-run="{{ key or '' }}" data-tab="archive">{{ '复算归档' if key else '归档场次' }}</button><output id="feedback" role="status"></output></section><section class="panel"><h3>近期扩推批次</h3><ul>{% for row in recent %}<li><a href="{{ url_for('workbench.desk',tab='archive',run=row.id) }}">{{ row.id[:12] }} · {{ row.created }}</a></li>{% else %}<li>暂无归档。</li>{% endfor %}</ul></section></div>
