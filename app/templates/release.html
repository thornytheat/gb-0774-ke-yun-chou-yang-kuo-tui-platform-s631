<div class="quality-grid detail"><section class="panel"><h3>样本证据签发</h3>{% if proof %}<p class="badge">原件与核算摘要已校验</p><p class="digest">{{ proof.seal }}</p><a class="solid" href="{{ url_for('survey.export',key=key) }}">下载样本证据</a>{% else %}<button id="save-run" data-sample="{{ sample }}" data-run="" data-tab="release">归档并校验</button><output id="feedback" role="status"></output>{% endif %}</section><section class="panel"><h3>签发清单</h3><dl><dt>回收裁决隔离</dt><dd>{{ data.returns.totals.isolated }} 行</dd><dt>班次与问项隔离</dt><dd>{{ data.frame.counts.invalid }} 行</dd><dt>未有效回应</dt><dd>{{ data.frame.counts.nonresponse }} 行</dd></dl></section></div>
